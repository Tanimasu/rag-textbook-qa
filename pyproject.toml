[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-textbook-qa"
version = "0.1.0"
description = "Cross-platform RAG question-answering system for Chinese computer science textbooks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "chromadb",
    "jieba",
    "openai",
    "python-dotenv",
    "rank-bm25",
    "tqdm",
]

[project.optional-dependencies]
local-models = [
    "sentence-transformers",
    "torch",
]
ui = [
    "pandas",
    "streamlit",
]
eval = [
    "datasets",
    "langchain-community",
    "langchain-openai",
    "pandas",
    "ragas",
]
docling = [
    "docling",
    "easyocr",
]
mineru = [
    "mineru",
    "pymupdf",
]
worker = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "fastapi",
    "pytest",
    "pytest-cov",
    "requests",
    "ruff",
]

[project.scripts]
rag-qa = "rag_textbook_qa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_textbook_qa"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
