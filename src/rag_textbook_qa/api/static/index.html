<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>计算机教材问答</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1c2330; --muted: #5c6675; --line: #e3e6eb;
  --accent: #2f6fed; --accent-soft: #e8f0fe; --user: #2f6fed; --user-text: #ffffff;
  --warn-bg: #fff6e0; --warn-text: #7a5300; --err-bg: #fdecec; --err-text: #9b1c1c;
  --code-bg: #f1f3f6; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a3039;
    --accent: #6ea0ff; --accent-soft: #1d2a42; --user: #3b6fd8; --user-text: #ffffff;
    --warn-bg: #3a2e12; --warn-text: #f3d28a; --err-bg: #3d1a1a; --err-text: #f4a3a3;
    --code-bg: #20252d; --shadow: none;
  }
}
* { box-sizing: border-box; }
/* Author `display` rules (e.g. `.toolbar label { display: flex }`) beat the browser's
   own `[hidden]` rule, which would leave hidden elements on screen. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
.app { max-width: 860px; margin: 0 auto; padding: 0 16px; min-height: 100%; display: flex; flex-direction: column; }
header { padding: 20px 0 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
.brand h1 { margin: 0; font-size: 20px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.header-links { display: flex; gap: 14px; font-size: 13px; }
.header-links a { color: var(--muted); text-decoration: none; }
.header-links a:hover { color: var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.toolbar label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.toolbar-button {
  font: inherit; font-size: 13px; color: var(--muted); background: transparent;
  border: 0; padding: 4px 0; cursor: pointer;
}
.toolbar-button:hover { color: var(--accent); }
.toolbar-button:disabled { opacity: .5; cursor: default; }
select, input[type=password] {
  font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel); color: var(--text); max-width: 100%;
}
.quota { margin-left: auto; font-size: 12px; color: var(--muted); }
main { flex: 1; padding: 16px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 0 20px; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.examples button {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer;
}
.examples button:hover { border-color: var(--accent); color: var(--accent); }
.msg { margin: 14px 0; display: flex; }
.msg.user { justify-content: flex-end; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
.answer { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.answer .body { word-break: break-word; }
.answer .body.progress { color: var(--muted); }
.answer .body h2, .answer .body h3 { font-size: 16px; margin: 14px 0 6px; }
.answer .body > :first-child { margin-top: 0; }
.answer .body p { margin: 6px 0; }
.answer .body ul, .answer .body ol { margin: 6px 0; padding-left: 22px; }
.answer .body code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.answer .body pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
.answer .body pre code { background: none; padding: 0; }
.cite {
  font: inherit; font-size: 12px; border: 0; background: var(--accent-soft); color: var(--accent);
  border-radius: 6px; padding: 0 6px; margin: 0 2px; cursor: pointer;
}
.cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.notice { margin-top: 10px; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.notice.warn { background: var(--warn-bg); color: var(--warn-text); }
.notice.error { background: var(--err-bg); color: var(--err-text); }
.meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.actions { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.action {
  font: inherit; font-size: 13px; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; cursor: pointer;
}
.action:hover { color: var(--accent); border-color: var(--accent); }
.action:disabled { opacity: .55; cursor: default; }
.feedback-status { color: var(--muted); font-size: 13px; }
.feedback-panel {
  margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); display: grid; gap: 8px;
}
.feedback-panel[hidden] { display: none; }
.feedback-panel textarea {
  width: 100%; resize: vertical; min-height: 64px; max-height: 150px; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text);
  font: inherit; font-size: 13px;
}
.feedback-panel .submit-row { display: flex; justify-content: flex-end; }
details.sources { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
details.sources summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.source { margin: 8px 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); transition: box-shadow .2s, border-color .2s; }
.source.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.source .title { font-size: 13px; font-weight: 600; }
.source .section { font-size: 12px; color: var(--muted); }
.source .excerpt { font-size: 13px; margin-top: 4px; white-space: pre-wrap; max-height: 12em; overflow: auto; }
.composer { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 14px; }
.composer form {
  display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 8px; box-shadow: var(--shadow);
}
.composer textarea {
  flex: 1; min-width: 0; resize: none; border: 0; outline: none; background: transparent;
  color: var(--text); font: inherit; max-height: 160px; padding: 6px;
}
.composer button { font: inherit; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
.composer button:disabled { opacity: .5; cursor: not-allowed; }
.composer .cancel { background: transparent; color: var(--err-text); border: 1px solid var(--line); }
footer { font-size: 12px; color: var(--muted); text-align: center; padding: 4px 0 16px; }
@media (max-width: 520px) { .bubble { max-width: 92%; } .quota { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>计算机教材问答</h1>
      <p>基于五本计算机教材的检索增强问答，回答会标注引用的教材原文</p>
    </div>
    <nav class="header-links">
      <a href="/docs" target="_blank" rel="noopener">API 文档</a>
      <a href="https://github.com/Tanimasu/rag-textbook-qa" target="_blank" rel="noopener">源代码</a>
    </nav>
  </header>

  <div class="toolbar">
    <label>教材 <select id="book" required><option value="" selected disabled>请选择教材</option></select></label>
    <label id="code-field" hidden>访问口令 <input id="code" type="password" autocomplete="off"></label>
    <button class="toolbar-button" id="clear" type="button" hidden>清空对话</button>
    <span class="quota" id="quota"></span>
  </div>

  <main id="thread">
    <div class="empty" id="empty">
      <div>可以问概念、比较或原理类的问题，回答会标注它依据的教材片段。</div>
      <div class="examples">
        <button type="button">什么是进程？它和程序有什么区别？</button>
        <button type="button">主键和唯一索引有什么区别？</button>
        <button type="button">散列表是怎样解决冲突的？</button>
        <button type="button">Cache 在存储层次中起什么作用？</button>
      </div>
    </div>
  </main>

  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" maxlength="500" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="cancel" id="cancel" type="button" hidden>停止生成</button>
      <button id="send" type="submit">发送</button>
    </form>
  </div>
  <footer>回答由大模型依据检索到的教材片段生成，可能出错，请以原文为准。回答会短暂保留在进程内存中；只有主动提交反馈时，本次问题、回答、引用和耗时才会持久保存，反馈数据不包含 IP 或凭据。未通过验收的实验功能在公开版中关闭。</footer>
</div>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), empty = $("empty"), form = $("form"), input = $("input");
  const send = $("send"), bookSelect = $("book"), codeField = $("code-field");
  const codeInput = $("code"), quota = $("quota"), cancel = $("cancel"), clear = $("clear");
  const CODE_KEY = "rag-qa-access-code";
  let busy = false, activeController = null;

  const sessionGet = (key) => { try { return sessionStorage.getItem(key) || ""; } catch { return ""; } };
  const sessionSet = (key, value) => { try { sessionStorage.setItem(key, value); } catch { /* storage may be blocked */ } };

  const escapeHtml = (text) => text.replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[character]));

  // Runs on already-escaped text, so every tag it emits is one it chose to emit.
  const inline = (text) => text
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/【参考资料\s*(\d+)】/g, '<button type="button" class="cite" data-cite="$1">资料 $1</button>');

  function renderMarkdown(source) {
    const out = [];
    let list = null, code = null, paragraph = [];
    const flushParagraph = () => {
      if (paragraph.length) { out.push("<p>" + inline(paragraph.join("<br>")) + "</p>"); paragraph = []; }
    };
    const closeList = () => { if (list) { out.push("</" + list + ">"); list = null; } };
    for (const line of escapeHtml(source).split("\n")) {
      if (code !== null) {
        if (/^\s*```/.test(line)) { out.push("<pre><code>" + code.join("\n") + "</code></pre>"); code = null; }
        else code.push(line);
        continue;
      }
      if (/^\s*```/.test(line)) { flushParagraph(); closeList(); code = []; continue; }
      const heading = line.match(/^\s*(#{1,6})\s+(.*)$/);
      if (heading) {
        flushParagraph(); closeList();
        const level = Math.min(heading[1].length + 1, 3);
        out.push(`<h${level}>${inline(heading[2])}</h${level}>`);
        continue;
      }
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      const numbered = bullet ? null : line.match(/^\s*(\d+)[.)]\s+(.*)$/);
      if (bullet || numbered) {
        flushParagraph();
        const kind = bullet ? "ul" : "ol";
        if (list !== kind) {
          closeList();
          // Keep the model's own number. A paragraph between items closes the list,
          // and a fresh <ol> would otherwise restart every item at 1.
          out.push(numbered ? `<ol start="${numbered[1]}">` : "<ul>");
          list = kind;
        }
        out.push("<li>" + inline(bullet ? bullet[1] : numbered[2]) + "</li>");
        continue;
      }
      if (!line.trim()) { flushParagraph(); closeList(); continue; }
      closeList();
      paragraph.push(line);
    }
    if (code !== null) out.push("<pre><code>" + code.join("\n") + "</code></pre>");
    flushParagraph(); closeList();
    return out.join("");
  }

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addNotice(card, message, kind) {
    card.append(element("div", "notice " + kind, message));
  }

  function addRetry(card, query, bookId) {
    if (card.querySelector("[data-retry]")) return;
    let actions = card.querySelector(".actions");
    if (!actions) {
      actions = element("div", "actions");
      card.append(actions);
    }
    const retry = element("button", "action", "重试本题");
    retry.type = "button";
    retry.dataset.retry = "true";
    retry.addEventListener("click", () => {
      input.value = query;
      bookSelect.value = bookId;
      autosize();
      ask();
    });
    actions.append(retry);
  }

  function addUser(text) {
    empty.hidden = true;
    clear.hidden = false;
    const row = element("div", "msg user");
    row.append(element("div", "bubble", text));
    thread.append(row);
  }

  function addAnswer() {
    const row = element("div", "msg");
    const card = element("div", "answer");
    const body = element("div", "body cursor progress", "正在检索教材…");
    body.setAttribute("role", "status");
    body.setAttribute("aria-live", "polite");
    card.append(body);
    row.append(card);
    thread.append(row);
    row.scrollIntoView({ block: "end" });
    return card;
  }

  function renderSources(sources, open) {
    const details = element("details", "sources");
    details.open = open;
    details.append(element("summary", "", `参考的教材片段（${sources.length}）`));
    for (const source of sources) {
      const item = element("div", "source");
      item.dataset.citation = String(source.citation_id);
      item.append(
        element("div", "title", `资料 ${source.citation_id} · ${source.book}`),
        element("div", "section", (source.section || "未标注章节") + (source.truncated ? " · 片段已截断" : "")),
        element("div", "excerpt", source.excerpt),
      );
      details.append(item);
    }
    return details;
  }

  async function copyText(text) {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const area = element("textarea");
    area.value = text;
    area.readOnly = true;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.append(area);
    area.select();
    const copied = document.execCommand("copy");
    area.remove();
    if (!copied) throw new Error("copy failed");
  }

  async function saveFeedback(card, result, rating, reason, comment, buttons) {
    for (const button of buttons) button.disabled = true;
    try {
      const response = await fetch("/v1/feedback", {
        method: "POST",
        headers: requestHeaders(),
        body: JSON.stringify({ answer_id: result.answer_id, rating, reason, comment }),
      });
      if (!response.ok) {
        for (const button of buttons) button.disabled = false;
        await explainRefusal(card, response, "反馈提交");
        return;
      }
      card.querySelector(".feedback-panel")?.remove();
      const actions = card.querySelector(".actions");
      for (const button of actions.querySelectorAll("[data-feedback]")) button.remove();
      actions.append(element("span", "feedback-status", "感谢反馈，已经记录。"));
    } catch {
      for (const button of buttons) button.disabled = false;
      addNotice(card, "反馈暂时没有保存成功，请稍后再试。", "error");
    }
  }

  function renderActions(card, result) {
    const actions = element("div", "actions");
    if (result.answer) {
      const copy = element("button", "action", "复制答案");
      copy.type = "button";
      copy.addEventListener("click", async () => {
        try {
          await copyText(result.answer);
          copy.textContent = "已复制";
          window.setTimeout(() => { copy.textContent = "复制答案"; }, 1500);
        } catch {
          copy.textContent = "复制失败";
        }
      });
      actions.append(copy);
    }
    if (!result.answer_id) {
      if (actions.children.length) card.append(actions);
      return;
    }

    const helpful = element("button", "action", "👍 有帮助");
    const improve = element("button", "action", "👎 需要改进");
    for (const button of [helpful, improve]) {
      button.type = "button";
      button.dataset.feedback = "true";
    }
    actions.append(helpful, improve);
    card.append(actions);

    const panel = element("div", "feedback-panel");
    panel.hidden = true;
    const reason = element("select");
    reason.required = true;
    for (const [value, label] of [
      ["", "请选择需要改进的原因"],
      ["not_answered", "没有回答问题"],
      ["irrelevant_sources", "检索资料不相关"],
      ["unsupported_answer", "答案与教材不一致"],
      ["incomplete", "回答不完整"],
      ["too_slow", "速度太慢"],
      ["other", "其他"],
    ]) {
      const option = element("option", "", label);
      option.value = value;
      if (!value) { option.disabled = true; option.selected = true; }
      reason.append(option);
    }
    const comment = element("textarea");
    comment.maxLength = 500;
    comment.placeholder = "可以补充说明（选择“其他”时必填，最多 500 字）";
    const submitRow = element("div", "submit-row");
    const submit = element("button", "action", "提交反馈");
    submit.type = "button";
    submitRow.append(submit);
    panel.append(reason, comment, submitRow);
    card.append(panel);

    const buttons = [helpful, improve, submit];
    helpful.addEventListener("click", () => {
      saveFeedback(card, result, "helpful", null, "", buttons);
    });
    improve.addEventListener("click", () => {
      panel.hidden = !panel.hidden;
      if (!panel.hidden) reason.focus();
    });
    submit.addEventListener("click", () => {
      if (!reason.value) { reason.reportValidity(); return; }
      const note = comment.value.trim();
      if (reason.value === "other" && !note) {
        comment.setCustomValidity("选择其他时请填写补充说明");
        comment.reportValidity();
        return;
      }
      comment.setCustomValidity("");
      saveFeedback(card, result, "needs_improvement", reason.value, note, buttons);
    });
    comment.addEventListener("input", () => comment.setCustomValidity(""));
  }

  function finish(card, result) {
    const body = card.querySelector(".body");
    body.classList.remove("cursor", "progress");
    body.innerHTML = result.answer ? renderMarkdown(result.answer) : "";
    if (result.message) addNotice(card, result.message, result.status === "failed" ? "error" : "warn");
    if (result.conflicts && result.conflicts.length) {
      addNotice(card, `检索到的教材在「${result.conflicts.join("、")}」上说法不一致，回答里应当并列给出两种说法。`, "warn");
    }
    const timing = result.timing || {};
    const chips = [
      ["retrieval_seconds", "检索"], ["first_token_seconds", "首字"], ["total_seconds", "总计"],
    ].filter(([key]) => typeof timing[key] === "number")
      .map(([key, label]) => `${label} ${timing[key].toFixed(2)} 秒`);
    if (chips.length) {
      const meta = element("div", "meta");
      for (const chip of chips) meta.append(element("span", "chip", chip));
      card.append(meta);
    }
    if (result.sources && result.sources.length) {
      card.append(renderSources(result.sources, result.status !== "answered"));
    }
    renderActions(card, result);
  }

  function parseEvent(frame) {
    let name = "message";
    const data = [];
    for (const line of frame.split("\n")) {
      if (line.startsWith("event:")) name = line.slice(6).trim();
      else if (line.startsWith("data:")) data.push(line.slice(5).replace(/^ /, ""));
    }
    if (!data.length) return null;
    try { return { name, data: JSON.parse(data.join("\n")) }; } catch { return null; }
  }

  function requestHeaders() {
    const headers = { "Content-Type": "application/json" };
    const code = codeInput.value.trim();
    if (code) { headers["X-Access-Code"] = code; sessionSet(CODE_KEY, code); }
    return headers;
  }

  async function explainRefusal(card, response, activity = "提问") {
    let detail = "";
    try { detail = (await response.json()).detail; } catch { /* body was not JSON */ }
    if (response.status === 401) {
      codeField.hidden = false;
      codeInput.focus();
      addNotice(card, "需要正确的访问口令，请在上方填写后重试。", "error");
    } else if (response.status === 429) {
      const wait = response.headers.get("Retry-After");
      addNotice(card, wait ? `${activity}太频繁了，请 ${wait} 秒后再试。` : `${activity}太频繁了，请稍后再试。`, "warn");
    } else if (typeof detail === "string" && detail) {
      addNotice(card, detail, "error");
    } else {
      addNotice(card, response.status === 422 ? "问题格式不正确，最多 500 字。" : "暂时无法完成回答，请稍后再试。", "error");
    }
  }

  async function ask() {
    const query = input.value.trim();
    if (!query || busy) return;
    const bookId = bookSelect.value;
    if (!bookId) {
      bookSelect.setCustomValidity("请先选择一本教材");
      bookSelect.reportValidity();
      bookSelect.focus();
      return;
    }
    bookSelect.setCustomValidity("");
    busy = true;
    send.disabled = true;
    clear.disabled = true;
    cancel.hidden = false;
    activeController = new AbortController();
    thread.setAttribute("aria-busy", "true");
    input.value = "";
    autosize();
    addUser(query);
    const card = addAnswer();
    const body = card.querySelector(".body");
    let text = "", paintTimer = 0, settled = false, autoFollow = true;
    let lastScrollY = window.scrollY;
    const nearBottom = () => (
      window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 120
    );
    const trackScrollIntent = () => {
      const nextScrollY = window.scrollY;
      if (nextScrollY < lastScrollY) autoFollow = false;
      else if (nearBottom()) autoFollow = true;
      lastScrollY = nextScrollY;
    };
    window.addEventListener("scroll", trackScrollIntent, { passive: true });
    const paint = () => {
      paintTimer = 0;
      body.classList.remove("progress");
      body.innerHTML = renderMarkdown(text);
      if (autoFollow) window.scrollTo(0, document.documentElement.scrollHeight);
    };
    const schedulePaint = () => {
      // Rebuilding the whole Markdown DOM for every token makes scrolling fight
      // repeated layout changes. Eight updates per second still feels live.
      if (!paintTimer) paintTimer = window.setTimeout(paint, 125);
    };
    const cancelPaint = () => {
      if (paintTimer) window.clearTimeout(paintTimer);
      paintTimer = 0;
    };
    try {
      const response = await fetch("/v1/ask/stream", {
        method: "POST",
        headers: requestHeaders(),
        body: JSON.stringify({ query, book_id: bookId }),
        signal: activeController.signal,
      });
      if (!response.ok) {
        body.classList.remove("cursor", "progress");
        await explainRefusal(card, response);
        addRetry(card, query, bookId);
        return;
      }
      body.textContent = "正在组织答案…";
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) !== -1) {
          const event = parseEvent(buffer.slice(0, boundary));
          buffer = buffer.slice(boundary + 2);
          if (!event) continue;
          if (event.name === "chunk") {
            text += event.data.text;
            schedulePaint();
          } else if (event.name === "result") {
            settled = true;
            cancelPaint();
            finish(card, event.data);
            if (event.data.status === "failed") addRetry(card, query, bookId);
            if (autoFollow) window.scrollTo(0, document.documentElement.scrollHeight);
          } else if (event.name === "error") {
            settled = true;
            cancelPaint();
            body.classList.remove("cursor", "progress");
            body.innerHTML = text ? renderMarkdown(text) : "";
            addNotice(card, event.data.message, event.data.status === "busy" ? "warn" : "error");
            addRetry(card, query, bookId);
          }
        }
      }
      if (!settled) {
        cancelPaint();
        body.classList.remove("cursor", "progress");
        body.innerHTML = text ? renderMarkdown(text) : "";
        addNotice(card, "连接中断了，回答没有完整返回。", "error");
        addRetry(card, query, bookId);
      }
    } catch (error) {
      cancelPaint();
      body.classList.remove("cursor", "progress");
      body.innerHTML = text ? renderMarkdown(text) : "";
      addNotice(card, error.name === "AbortError" ? "已停止生成。" : "网络异常，请稍后重试。", error.name === "AbortError" ? "warn" : "error");
      addRetry(card, query, bookId);
    } finally {
      window.removeEventListener("scroll", trackScrollIntent);
      busy = false;
      activeController = null;
      send.disabled = false;
      clear.disabled = false;
      cancel.hidden = true;
      thread.removeAttribute("aria-busy");
      input.focus();
      refreshStatus();
    }
  }

  async function refreshStatus() {
    try {
      const health = await (await fetch("/health")).json();
      if (health.access_code_required) {
        codeField.hidden = false;
        if (!codeInput.value) codeInput.value = sessionGet(CODE_KEY);
      }
      quota.textContent = typeof health.generations_remaining_today === "number"
        ? `今日剩余生成次数：${health.generations_remaining_today}` : "";
    } catch {
      quota.textContent = "";
    }
  }

  async function loadBooks() {
    try {
      const books = await (await fetch("/v1/books")).json();
      if (!books.length) bookSelect.options[0].textContent = "暂无可用教材";
      for (const book of books) {
        const option = element("option", "", book.label);
        option.value = book.book_id;
        bookSelect.append(option);
      }
    } catch { bookSelect.options[0].textContent = "教材加载失败"; }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  thread.addEventListener("click", (event) => {
    const example = event.target.closest(".examples button");
    if (example) { input.value = example.textContent; ask(); return; }
    const cite = event.target.closest(".cite");
    if (!cite) return;
    const details = cite.closest(".answer")?.querySelector("details.sources");
    const target = details?.querySelector(`.source[data-citation="${cite.dataset.cite}"]`);
    if (!target) return;
    details.open = true;
    target.scrollIntoView({ behavior: "smooth", block: "center" });
    target.classList.add("flash");
    setTimeout(() => target.classList.remove("flash"), 1600);
  });
  input.addEventListener("input", autosize);
  bookSelect.addEventListener("change", () => bookSelect.setCustomValidity(""));
  input.addEventListener("keydown", (event) => {
    // isComposing: Enter that confirms a Chinese IME candidate must not send.
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) { event.preventDefault(); ask(); }
  });
  form.addEventListener("submit", (event) => { event.preventDefault(); ask(); });
  cancel.addEventListener("click", () => activeController?.abort());
  clear.addEventListener("click", () => {
    if (busy) return;
    for (const message of thread.querySelectorAll(".msg")) message.remove();
    empty.hidden = false;
    clear.hidden = true;
    input.focus();
  });
  loadBooks();
  refreshStatus();
})();
</script>
</body>
</html>
