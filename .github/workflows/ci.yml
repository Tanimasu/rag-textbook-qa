name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.27"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test dependencies
        run: uv sync --locked --extra ui --extra worker --extra api

      - name: Verify matrix interpreter
        run: uv run --no-sync python -c "import sys; print(sys.version); assert f'{sys.version_info.major}.{sys.version_info.minor}' == '${{ matrix.python-version }}'"

      - name: Lint packaged code, tests, and release helpers
        run: uv run --no-sync python -m ruff check src tests scripts

      - name: Run offline test suite
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Verify queue saturation and cancellation over real HTTP
        run: uv run --no-sync python scripts/check_serving_queue.py --output artifacts/evaluations/ci/queue-http.json

      - name: Compile Python sources
        run: uv run --no-sync python -m compileall -q src tests project

      - name: Parse Windows Worker launcher
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/windows/start-worker.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  browser:
    name: Public chat / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.27"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked browser test dependencies
        run: uv sync --locked --only-group browser

      - name: Install Chromium and system libraries
        run: uv run --no-sync python -m playwright install --with-deps chromium

      - name: Run public chat in a real browser with a local fake backend
        run: uv run --no-sync python tests/browser/public_chat_browser.py -v

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.27"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked build and package dependencies
        run: |
          uv sync --locked --only-group build
          uv sync --locked --no-dev --group build --extra eval --extra ui --extra worker --extra api --no-editable --no-build-isolation

      - name: Build source and wheel distributions
        run: uv run --no-sync python -m build --no-isolation

      - name: Verify packaged entry points and Web UI
        run: |
          uv run --no-sync python scripts/check_distribution.py dist
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          uv run --no-sync python -c "import datasets, ragas; from datasets import Dataset; assert len(Dataset.from_dict({'question': ['ok']})) == 1"
          uv run --no-sync python -c "from rag_textbook_qa.evaluation import RAGASEvaluator; evaluator = RAGASEvaluator(api_key='ci-only', base_url='http://127.0.0.1:9/v1', model='test-model'); assert evaluator._answer_relevancy.strictness == 1; assert evaluator.embeddings.check_embedding_ctx_length is False"
          uv run --no-sync rag-qa --help
          uv run --no-sync rag-qa doctor --json
